# Production: one VPS at taller.yunquelabs.com, shared with the owner's gym app, set up as in docs/deploy.md.
service: tailor_shop_ledger

image: tailor_shop_ledger

servers:
  web:
    - 15.204.248.201

# kamal-proxy terminates HTTPS with a Let's Encrypt certificate, which needs the DNS record with
# Cloudflare's proxy off. production.rb assumes and forces SSL behind it. The gym app runs the same
# kamal-proxy: deploys leave it running, and only `kamal proxy reboot` would restart it under both apps.
proxy:
  ssl: true
  host: taller.yunquelabs.com

# A registry on this machine that the server reaches through the SSH connection: no account anywhere.
registry:
  server: localhost:5555

# The server takes no root logins.
ssh:
  user: ubuntu

env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - SENTRY_DSN
  clear:
    # Solid Queue runs inside Puma: there is one server.
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: tailor_shop_ledger-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Bridge fingerprinted assets between versions, so in-flight requests don't hit a 404.
asset_path: /rails/public/assets

builder:
  arch: amd64

# PostgreSQL publishes no port: the app reaches it on Docker's private network, and a published
# port would get past the firewall.
accessories:
  db:
    image: postgres:17
    host: 15.204.248.201
    env:
      clear:
        POSTGRES_USER: tailor_shop_ledger
        POSTGRES_DB: tailor_shop_ledger_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
