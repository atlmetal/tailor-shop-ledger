# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

# Only the RSpec cops that back the spec rules in CLAUDE.md.
RSpec:
  Enabled: false

RSpec/AnyInstance:
  Enabled: true
RSpec/DescribedClass:
  Enabled: true
RSpec/InstanceVariable:
  Enabled: true
RSpec/IteratedExpectation:
  Enabled: true
RSpec/LeakyConstantDeclaration:
  Enabled: true
RSpec/MessageSpies:
  Enabled: true
RSpec/StubbedMock:
  Enabled: true
RSpec/VerifiedDoubles:
  Enabled: true
